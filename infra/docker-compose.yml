services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: chessmonitor
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    ports:
      - "5432:5432"
    volumes:
      - chessmonitor_db:/var/lib/postgresql/data

  api:
    build:
      context: ../src
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=chessmonitor;Username=chess;Password=chess
    ports:
      - "8080:8080"
    depends_on:
      - db

  worker:
    build:
      context: ../src
      dockerfile: worker/Dockerfile
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=chessmonitor;Username=chess;Password=chess
      ChessCom__Username: ${CHESSCOM_USERNAME}
      Stockfish__Threads: "8"
      Stockfish__Depth: "16"
    depends_on:
      - db

  web:
    build:
      context: ../src
      dockerfile: web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  chessmonitor_db: